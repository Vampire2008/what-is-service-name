name: Deploy

on:
    workflow_dispatch:

jobs:
    test:
        uses: ./.github/workflows/test.yml

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/setup@v2
              with:
                  runtime: node@latest

            - name: Build project
              run: pnpm run build

            - name: Deploy
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        permissions:
            id-token: write
            pages: write
        steps:
            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
